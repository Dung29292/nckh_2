[tool.poetry]
name = "nckh-2"
version = "0.1.0"
description = "NCKH 2 - Pha 1: tai tao 3D 5 mat chiec hop tu video RGB"
authors = ["nckh"]
readme = "README.md"
packages = [{ include = "nckh_2", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "<2"
opencv-python = "^4.9.0"
pyyaml = "^6.0"
tqdm = "^4.66"
open3d = ">=0.18,<0.20"

# Se bo sung o buoc sau (Buoc 2): torch (CUDA), Grounded-SAM 2
# Buoc 3 (Nerfstudio) nen dung moi truong Poetry rieng de tranh xung dot torch.
torch = {version = "2.5.1", source = "pytorch-cu121"}
torchvision = {version = "0.20.1", source = "pytorch-cu121"}
transformers = "^5.17.0"
pillow = "^12.3.0"
hydra-core = "^1.3.7"
iopath = "^0.1.10"
plyfile = "1.0.3"
gsplat = "1.4.0"

[tool.poetry.scripts]
nckh = "nckh_2.main:main"

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
