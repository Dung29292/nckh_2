video_file: video.mp4

record:
  camera: 1
  width: 1920
  height: 1080
  fps: 30
  mobile_port: 8443             # cong HTTPS/WebSocket mac dinh cho che do Camera dien thoai
  mobile_ssl: true              # bat HTTPS tu ky de trinh duyet dien thoai cho phep getUserMedia
  mobile_host_ip: ""            # de trong de tu dong chon IP Wi-Fi/Ethernet LAN

blur_filter:         # Buoc 1
  score_width: 640
  window: 5
  min_ratio: 0.6
  max_frames: 60
  save_max_side: 1920
  jpg_quality: 95

masking:             # Buoc 2
  prompt: "object"              # tu khoa nhan dien mac dinh: "object", "box", hoac chi dinh qua --prompt
  dino_model_id: "IDEA-Research/grounding-dino-tiny"
  dino_dir: models/grounding_dino
  box_threshold: 0.3
  text_threshold: 0.25
  detect_frames: 6
  box_pad_frac: 0.02            # mo rong box nhe (2%) tranh cat vien vat the
  base_pad_bottom_frac: 0.0     # 0.0: chi lay vat the, khong lay sach/de o duoi
  sam2_config: "configs/sam2.1/sam2.1_hiera_t.yaml"
  sam2_checkpoint: models/sam2/sam2.1_hiera_tiny.pt
  dilate_px: 0                  # 0: khong dilate; tang 2-5 neu vat the co vien mong

reconstruction:
  method: colmap_mvs            # splatfacto hoặc colmap_mvs
  pose_method: colmap       
  capture_mode: turntable
  matching_method: exhaustive   # exhaustive hoac sequential (dung sequential neu frame noi tiep deu)
  sequential_overlap: 15        # so frame lan can khi dung sequential matching
  sift_peak_threshold: 0.003    # nguong loc dac trung SIFT (0.002-0.004 giup bat dac trung vat the it texture nhu lo/coc)
  sift_max_features: 8192       # so dac trung toi da moi frame
  min_pose_ratio: 0.5
  warn_pose_collapse: true      # canh bao khi quy dao camera bi ket/don cuc (gay ra song bien)

mesh_export:         # Buoc 4
  mesh_mode: poisson           # obb (hop 6 mat) | poisson (be mat cong/phi phang) | both
  poisson_depth: 7              # 7 giup be mat cong cang tron, muot ma; tang 8 neu can chi tiet cuc nho
  poisson_density_quantile: 0.01 # 0.01 chi cat vien mo, khong bi rach lung vat the nhu 0.05
  stat_nb: 20
  stat_ratio: 2.0
  rad_nb: 5
  rad_radius_frac: 0.03
  cluster_eps_frac: 0.02        # ban kinh DBSCAN loc nhieu troi noi
  cluster_min_ratio: 0.03       # giu cac cum con >= 3% cum chinh (bao ve nap cam, quai xach khoi bi cat)
  cluster_min_points: 40
  voxel_frac: 0.005             # hop nhat lop diem kep tranh tao gon song
  normal_radius_frac: 0.07      # ban kinh tinh phap tuyen em ai, tranh giat cuc bo
  normal_nn: 40
  orient_k: 15
  normal_smooth_iter: 2         # lam muot truong phap tuyen k-NN truoc khi dung Poisson
  normal_smooth_k: 25

  # --- Tien xu ly lam muot point cloud (MLS: Moving Least Squares) ---
  mls_iter: 1                   # 1 vong MLS chieu diem ve tiep dien cuc bo, triet tieu ranh khia
  mls_neighbors: 30             # so diem lang gieng fit tiep dien
  mls_alpha: 0.75               # do em chieu diem (0.7-0.85 giu form dang nhung xoa gon song)

  # --- Lam min mesh so bo tai Buoc 4 ---
  smooth_type: "taubin"         # taubin (lam min khong teo the tich) hoac laplacian
  smooth_iter: 30               # so vong lam min so bo (30 vong Taubin)
  smooth_lambda: 0.5
  smooth_mu: -0.53
  polish_iter: 3                # so vong danh bong nhe nhàng so bo

  # false: giu dung 100% be mat thuc te cua vat the phi phang; true: bit phang day
  make_watertight: false

  # --- Loc mat phang ban xoay / de hoa van (RANSAC) ---
  remove_table_plane: true      # tu dong cat bo mat phang ban xoay ma khong chem cheo vat the
  plane_dist_threshold_frac: 0.012 # nguong khoang cach xac dinh diem thuoc mat phang san

  # --- Cat phan thua ngoai vat the (vay Poisson) ---
  poisson_hull_pad_frac: 0.03

  # --- Can thang dung (Z-up) & dat len mat san (Z=0) ---
  align_upright: true           # tu dong can thang truc Z-up, dua ve goc (0,0) va tiep dat sat san Z=0

completion:              # Hoan thien vung bi che lap theo Prompt + Anh Web (Depth-Free, khong can Depth Anything)
  mode: "retrieval_guided"      # retrieval_guided (Visual Hull + Web Ref + Biharmonic) | legacy_heuristic
  prior_backend: "auto"         # auto (Gemini neu co GEMINI_API_KEY, nguoc lai heuristic) | gemini | heuristic
  enable_web_retrieval: true    # tim & xac thuc anh tham chieu tren mang + thu muc web_refs/manual/
  web_provider: "duckduckgo"    # duckduckgo | google_cse | serpapi | manual_only
  web_online: true              # false: chi dung cache & anh tha tay trong web_refs/manual/
  web_max_per_query: 5
  web_min_verify_score: 0.56    # nguong loc san pham trung khop (Visual Feature + Lab Color)
  visual_hull_res: 64           # do phan giai luoi voxel Visual Hull tu mask Buoc 2
  visual_hull_pad_frac: 0.28
  visual_hull_consistency: 0.80
  use_symmetry: true            # tu dong noi suy doi xung (chi nhan neu ICP overlap >= symmetry_min_overlap)
  symmetry_min_overlap: 0.72
  virtual_view_size: 320        # kich thuoc khung hinh camera ao de phat hien & lap lo che khuat
  inpaint_backend: "fast_guided" # fast_guided (0 VRAM) | diffusers (SD1.5 + ControlNet-Depth fp16)
  use_gsplat_consolidation: false # bat true de tinh chinh da goc nhin bang gsplat 2DGS/3DGS (~2.5 GB VRAM)
  gsplat_iters: 120

mesh_refine:             # Buoc 5: Pipeline tinh chinh & lam min chuyen sau (chay doc lap hoac tu dong)
  auto_run: true                # tu dong chay ngay sau buoc 4
  align_upright: true           # bao toan can thang truc va dat sat san Z=0
  smooth_mode: "bilateral_normal" # bilateral_normal (giu sac canh/chi tiet nho) | pymeshlab_twostep | taubin
  bilateral_normal_iter: 6      # so vong loc phap tuyen song phuong (anisotropic)
  bilateral_vertex_iter: 20     # so vong can chinh dinh theo phap tuyen da loc
  bilateral_sigma_s_scale: 1.5  # ban kinh khong gian (boi so do dai canh trung binh)
  bilateral_sigma_r: 0.38       # nguong bao ve canh sac (nho hon -> canh/khoa/quai cang sac)
  bilateral_anchor_weight: 0.06 # luc neo giu dinh quan sat thuc te (w=1.0) khong bi troi/mo
  detail_residual_transfer: false # bat true neu vat co chi tiet khac noi sieu nong can doi chieu lai MVS
  detail_residual_strength: 0.25
  taubin_iter: 45               # dung khi smooth_mode: "taubin"
  taubin_lambda: 0.5
  taubin_mu: -0.53
  polish_iter: 4                # dung khi smooth_mode: "taubin"
  subdivide: false              # bat true neu can tang mat do luoi truoc khi lam min
  subdivide_method: "midpoint"  # midpoint hoac loop