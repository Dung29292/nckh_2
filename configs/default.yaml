video_file: video.mp4

record:
  camera: 1
  width: 1920
  height: 1080
  fps: 30

blur_filter:         # Buoc 1
  score_width: 640
  window: 5
  min_ratio: 0.6
  max_frames: 60
  save_max_side: 1920
  jpg_quality: 95

masking:             # Buoc 2
  prompt: "object"              # tu khoa nhan dien mac dinh: "object", "box", hoac chi dinh qua --prompt
  dino_model_id: "IDEA-Research/grounding-dino-tiny"
  dino_dir: models/grounding_dino
  box_threshold: 0.3
  text_threshold: 0.25
  detect_frames: 6
  box_pad_frac: 0.05            # mo rong box 5% tranh cat vien cong vat the
  sam2_config: "configs/sam2.1/sam2.1_hiera_t.yaml"
  sam2_checkpoint: models/sam2/sam2.1_hiera_tiny.pt
  dilate_px: 0                  # 0: khong dilate; tang 2-5 neu vat the co vien mong

reconstruction:
  method: colmap_mvs            # splatfacto hoặc colmap_mvs
  pose_method: colmap       
  capture_mode: turntable
  matching_method: exhaustive
  min_pose_ratio: 0.5

mesh_export:         # Buoc 4
  mesh_mode: poisson            # obb (hop 6 mat) | poisson (be mat cong/phi phang) | both
  poisson_depth: 7              # 7 giup be mat cong cang tron, muot ma; tang 8 neu can chi tiet cuc nho
  poisson_density_quantile: 0.01 # 0.01 chi cat vien mo, khong bi rach lung vat the nhu 0.05
  stat_nb: 20
  stat_ratio: 2.0
  rad_nb: 5
  rad_radius_frac: 0.03
  cluster_eps_frac: 0.02        # ban kinh DBSCAN loc nhieu troi noi
  cluster_min_ratio: 0.12       # giu cac cum con >= 12% cum chinh, khong cat mat phan vat the
  cluster_min_points: 40
  voxel_frac: 0.005             # hop nhat lop diem kep tranh tao gon song
  normal_radius_frac: 0.07      # ban kinh tinh phap tuyen em ai, tranh giat cuc bo
  normal_nn: 40
  orient_k: 15
  normal_smooth_iter: 2         # lam muot truong phap tuyen k-NN truoc khi dung Poisson
  normal_smooth_k: 25

  # --- Tien xu ly lam muot point cloud (MLS: Moving Least Squares) ---
  mls_iter: 1                   # 1 vong MLS chieu diem ve tiep dien cuc bo, triet tieu ranh khia
  mls_neighbors: 30             # so diem lang gieng fit tiep dien
  mls_alpha: 0.75               # do em chieu diem (0.7-0.85 giu form dang nhung xoa gon song)

  # --- Lam min mesh so bo tai Buoc 4 ---
  smooth_type: "taubin"         # taubin (lam min khong teo the tich) hoac laplacian
  smooth_iter: 30               # so vong lam min so bo (30 vong Taubin)
  smooth_lambda: 0.5
  smooth_mu: -0.53
  polish_iter: 3                # so vong danh bong nhe nhàng so bo

  # false: giu dung 100% be mat thuc te cua vat the phi phang; true: bit phang day
  make_watertight: false

  # --- Cat phan thua ngoai vat the (vay Poisson) ---
  poisson_hull_pad_frac: 0.03

mesh_refine:             # Buoc 5: Pipeline tinh chinh & lam min chuyen sau (chay doc lap hoac tu dong)
  auto_run: true                # tu dong chay ngay sau buoc 4
  taubin_iter: 45               # so vong Taubin triet tieu song/ranh khong teo the tich
  taubin_lambda: 0.5
  taubin_mu: -0.53
  polish_iter: 4                # so vong danh bong lam muot be mat (simple polish)
  subdivide: false              # bat true neu can tang mat do luoi truoc khi lam min
  subdivide_method: "midpoint"  # midpoint hoac loop